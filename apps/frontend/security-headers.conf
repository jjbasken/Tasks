# Included into every location that sets headers of its own.
#
# nginx's add_header does NOT inherit into a block that has its own add_header
# directive, so a server-level list would be silently dropped by the /sw.js and
# /manifest.json locations below. Keeping the list in one file and including it
# per-location is what makes that failure mode impossible to reintroduce.
#
# All key material — the Argon2id stretch key, the curve25519 private key and a
# long-lived bearer token — lives in localStorage, so any script execution in
# this origin is a permanent account compromise rather than a session one. The
# CSP is the control that keeps that from being one injected tag away.
#
# 'unsafe-inline' applies to styles only: React sets inline style attributes and
# one component renders a <style> element. Scripts get neither 'unsafe-inline'
# nor 'unsafe-eval' — the built page carries no inline script at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
# Sent unconditionally: TLS is terminated upstream (Cloudflare Tunnel), so this
# server cannot tell an HTTPS request from a plaintext one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
