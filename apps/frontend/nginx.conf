server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version on responses and error pages.
    server_tokens off;

    # Behind Cloudflare Tunnel every connection arrives from the cloudflared
    # container, so $remote_addr alone would put all users in one rate-limit
    # bucket (one attacker could lock everyone out of login). Take the client
    # address from CF-Connecting-IP, but only when the connection comes from
    # cloudflared's fixed address on the compose `edge` network — anything else,
    # including the published host port, cannot spoof the header.
    set_real_ip_from 172.30.255.2;
    real_ip_header CF-Connecting-IP;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend rate-limits per source address. Set rather than append, so a
        # client-supplied X-Forwarded-For cannot forge the leftmost entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
