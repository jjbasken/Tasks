name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  configuration-scan:
    name: Configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

  container-scan:
    name: Container scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deployment image
        # The source label links a published package to this repository.
        run: >-
          docker build -f apps/${{ matrix.app }}/Dockerfile -t tasks-${{ matrix.app }}:scan
          --label org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          --label org.opencontainers.image.revision=$GITHUB_SHA .
      - name: Smoke test backend runtime
        if: matrix.app == 'backend'
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3001:3001 -e DATABASE_URL=:memory: -e CORS_ORIGIN=http://localhost:3000 -e JWT_SECRET="$(openssl rand -hex 32)" tasks-backend:scan
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3001/health
      - name: Smoke test frontend runtime
        if: matrix.app == 'frontend'
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --add-host backend:127.0.0.1 -p 127.0.0.1:8080:8080 tasks-frontend:scan
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/ | grep -i '<!doctype html>'
      - name: Clean up smoke test
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-${{ matrix.app }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      # Hand the exact image that passed the smoke test and scan to the publish
      # job, rather than rebuilding it there.
      - name: Save scanned image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: docker save tasks-${{ matrix.app }}:scan | gzip > tasks-${{ matrix.app }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: image-${{ matrix.app }}
          path: tasks-${{ matrix.app }}.tar.gz
          retention-days: 1

  publish:
    name: Publish image (${{ matrix.app }})
    # Only main is deployed. Waiting on every scan leg publishes both images
    # together or neither, so the frontend and backend never drift apart.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tasks-${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.app }}
      - name: Load scanned image
        run: gunzip -c tasks-${{ matrix.app }}.tar.gz | docker load
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          image="${IMAGE,,}"
          for tag in "sha-${GITHUB_SHA::12}" latest; do
            docker tag tasks-${{ matrix.app }}:scan "$image:$tag"
            docker push "$image:$tag"
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  tunnel-scan:
    name: Container scan (tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deployed tunnel image
        id: tunnel
        run: |
          image=$(awk '$1 == "image:" && $2 ~ /^cloudflare\/cloudflared:/ {print $2}' docker-compose.yml)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tunnel.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
        env:
          TRIVY_IGNOREFILE: .github/trivy/tunnel-ignore.yaml
