name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  configuration-scan:
    name: Configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

  container-scan:
    name: Container scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deployment image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t tasks-${{ matrix.app }}:scan .
      - name: Smoke test backend runtime
        if: matrix.app == 'backend'
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3001:3001 -e DATABASE_URL=:memory: -e CORS_ORIGIN=http://localhost:3000 -e JWT_SECRET="$(openssl rand -hex 32)" tasks-backend:scan
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3001/health
      - name: Smoke test frontend runtime
        if: matrix.app == 'frontend'
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --add-host backend:127.0.0.1 -p 127.0.0.1:8080:8080 tasks-frontend:scan
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/ | grep -i '<!doctype html>'
      - name: Clean up smoke test
        if: always()
        run: |
          docker logs smoke || true
          docker rm -f smoke || true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasks-${{ matrix.app }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

  tunnel-scan:
    name: Container scan (tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deployed tunnel image
        id: tunnel
        run: |
          image=$(awk '$1 == "image:" {print $2}' docker-compose.yml)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tunnel.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
