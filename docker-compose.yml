services:
  frontend:
    # Prebuilt by CI from main. `docker compose up --build` builds from source instead.
    image: ${TASKS_IMAGE_PREFIX:-ghcr.io/jjbasken}/tasks-frontend:${TASKS_TAG:-latest}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      default:
      # Fixed so it can never be handed cloudflared's trusted address when it
      # happens to join the network first.
      edge:
        ipv4_address: 10.213.47.3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    image: ${TASKS_IMAGE_PREFIX:-ghcr.io/jjbasken}/tasks-backend:${TASKS_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    expose:
      - "3001"
    environment:
      DATABASE_URL: /data/db.sqlite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      FILES_QUOTA_BYTES: ${FILES_QUOTA_BYTES:-}
    volumes:
      - ${DB_DATA_PATH:-./data}:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - frontend
    # Fixed address: nginx trusts CF-Connecting-IP only from this peer.
    networks:
      edge:
        ipv4_address: 10.213.47.2
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # Tunnel ingress only. cloudflared reaches nginx here and has no route to the
  # backend. Keep this subnet in sync with set_real_ip_from in nginx.conf.
  # Outside Docker's default address pools (172.17-31/16, 192.168/16), so it
  # cannot collide with networks Docker allocates automatically.
  edge:
    ipam:
      config:
        - subnet: 10.213.47.0/29
